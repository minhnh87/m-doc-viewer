<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Circular background -->
  <circle cx="16" cy="16" r="15" fill="#1e293b"/>

  <!-- Owl body/head -->
  <ellipse cx="16" cy="17" rx="10" ry="9" fill="#64748b"/>

  <!-- Ear tufts -->
  <path d="M8 10 L6 5 L10 9 Z" fill="#64748b"/>
  <path d="M24 10 L26 5 L22 9 Z" fill="#64748b"/>

  <!-- Face area -->
  <ellipse cx="16" cy="16" rx="8" ry="7" fill="#94a3b8"/>

  <!-- Glasses frames -->
  <circle cx="12" cy="14" r="4" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="20" cy="14" r="4" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Glasses bridge -->
  <path d="M16 14 L16 14" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="16" y1="13" x2="16" y2="15" stroke="#1e293b" stroke-width="1"/>

  <!-- Eyes (behind glasses) -->
  <circle cx="12" cy="14" r="2.5" fill="#fef3c7"/>
  <circle cx="20" cy="14" r="2.5" fill="#fef3c7"/>
  <!-- Pupils -->
  <circle cx="12.5" cy="14" r="1.2" fill="#1e293b"/>
  <circle cx="20.5" cy="14" r="1.2" fill="#1e293b"/>
  <!-- Eye shine -->
  <circle cx="11.8" cy="13.3" r="0.5" fill="white"/>
  <circle cx="19.8" cy="13.3" r="0.5" fill="white"/>

  <!-- Beak -->
  <path d="M16 17 L14.5 19.5 L16 19 L17.5 19.5 Z" fill="#f59e0b"/>

  <!-- Glasses arms (sides) -->
  <line x1="8" y1="14" x2="6" y2="13" stroke="#1e293b" stroke-width="1.2"/>
  <line x1="24" y1="14" x2="26" y2="13" stroke="#1e293b" stroke-width="1.2"/>
</svg>
